[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "mux"
version = "0.1.0"
authors = [
  { name="Your Name", email="your@email.com" },
]
description = "A dimension-based environment variable manager"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Environment :: Console",
]

[project.urls]
"Homepage" = "https://github.com/yourusername/mux"
"Bug Tracker" = "https://github.com/yourusername/mux/issues"

[project.scripts]
mux = "mux.cli:main"

[tool.poetry.dependencies]
python = "^3.10"
rich = "^13.7.1"
pytest = "^8.1.1"
pyyaml = "^6.0.1"